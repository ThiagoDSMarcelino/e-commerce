services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-server
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP message broker port
      - "15672:15672" # Management UI web console
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: securepassword123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  payments:
    build: ./payments
    container_name: payments-worker
    restart: unless-stopped
    environment:
      BROKER_URI: amqp://admin:securepassword123@rabbitmq:5672/
      EXCHANGE_NAME: e_commerce
      LOG_LEVEL: debug
    depends_on:
      rabbitmq:
        condition: service_healthy

  promotions:
    build: ./promotions
    container_name: promotions-worker
    restart: unless-stopped
    environment:
      BROKER_URI: amqp://admin:securepassword123@rabbitmq:5672/
      EXCHANGE_NAME: e_commerce
      LOG_LEVEL: debug
    depends_on:
      rabbitmq:
        condition: service_healthy

  shipping:
    build: ./shipping
    container_name: shipping-worker
    restart: unless-stopped
    environment:
      BROKER_URI: amqp://admin:securepassword123@rabbitmq:5672/
      EXCHANGE_NAME: e_commerce
      LOG_LEVEL: debug
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:
  rabbitmq_logs:
