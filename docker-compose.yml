services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-server
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: securepassword123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgresql:
    image: postgres:18
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keygen:
    image: alpine/openssl
    container_name: keygen
    volumes:
      - .:/repo
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        SERVICES="main payments promotions shipping storage"

        for s in $$SERVICES; do
          mkdir -p /repo/$$s/keys
          if [ ! -f /repo/$$s/keys/$$s.pem ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /repo/$$s/keys/$$s.pem
            openssl pkey -in /repo/$$s/keys/$$s.pem -pubout -out /repo/$$s/keys/$$s.pub
          fi
          chmod 600 /repo/$$s/keys/$$s.pem || true
        done

        for dest in $$SERVICES; do
          for src in $$SERVICES; do
            if [ "$$src" != "$$dest" ]; then
              cp /repo/$$src/keys/$$src.pub /repo/$$dest/keys/$$src.pub
            fi
          done
          chmod 644 /repo/$$dest/keys/*.pub || true
        done

  main:
    build: ./main
    container_name: main-api
    restart: unless-stopped
    environment:
      PORT: 8080
      BROKER_URI: amqp://admin:securepassword123@rabbitmq:5672/
      EXCHANGE_NAME: eCommerce
      LOG_LEVEL: debug
      SERVICE_NAME: main
      KEYS_DIR: /keys
      QUEUE_NAME: fila.principal
      GOOSE_DBSTRING: "host=localhost user=postgres password=postgres dbname=ecommerce sslmode=disable"
      GOOSE_DRIVER: postgres
      GOOSE_MIGRATION_DIR: ./internal/adapters/postgresql/migrations
    ports:
      - "8080:8080"
    volumes:
      - ./main/keys:/keys:ro
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully

  payments:
    build: ./payments
    container_name: payments-worker
    restart: unless-stopped
    environment:
      BROKER_URI: amqp://admin:securepassword123@rabbitmq:5672/
      EXCHANGE_NAME: eCommerce
      LOG_LEVEL: debug
      SERVICE_NAME: payments
      KEYS_DIR: /keys
      QUEUE_NAME: fila.pagamento
    volumes:
      - ./payments/keys:/keys:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully

  promotions:
    build: ./promotions
    container_name: promotions-worker
    restart: unless-stopped
    environment:
      BROKER_URI: amqp://admin:securepassword123@rabbitmq:5672/
      EXCHANGE_NAME: Promocoes
      LOG_LEVEL: debug
      SERVICE_NAME: promotions
      KEYS_DIR: /keys
    volumes:
      - ./promotions/keys:/keys:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully

  shipping:
    build: ./shipping
    container_name: shipping-worker
    restart: unless-stopped
    environment:
      BROKER_URI: amqp://admin:securepassword123@rabbitmq:5672/
      EXCHANGE_NAME: eCommerce
      LOG_LEVEL: debug
      SERVICE_NAME: shipping
      KEYS_DIR: /keys
      QUEUE_NAME: fila.entrega
    volumes:
      - ./shipping/keys:/keys:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully

  storage:
    build: ./storage
    container_name: storage-worker
    restart: unless-stopped
    environment:
      BROKER_URI: amqp://admin:securepassword123@rabbitmq:5672/%2f
      EXCHANGE_NAME: eCommerce
      SERVICE_NAME: storage
      STORAGE_FILE: /app/storage.json
      KEYS_DIR: /keys
    volumes:
      - ./storage/storage.json:/app/storage.json
      - ./storage/keys:/keys:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully

volumes:
  rabbitmq_data:
  rabbitmq_logs:
  postgres-data:
