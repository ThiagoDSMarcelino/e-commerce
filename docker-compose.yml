services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-server
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: securepassword123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  keygen:
    image: alpine/openssl
    container_name: keygen
    volumes:
      - keys:/keys
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for s in main payments promotions shipping; do
          if [ ! -f /keys/$$s.pem ]; then
            echo "gerando chaves para $$s"
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /keys/$$s.pem
            openssl pkey -in /keys/$$s.pem -pubout -out /keys/$$s.pub
          fi
        done
        chmod 644 /keys/*

  main:
    build: ./main
    container_name: main-worker
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      BROKER_URI: amqp://admin:securepassword123@rabbitmq:5672/
      EXCHANGE_NAME: e_commerce
      LOG_LEVEL: debug
      SERVICE_NAME: main
      KEYS_DIR: /keys
      QUEUE_NAME: fila.principal
    volumes:
      - keys:/keys:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully

  payments:
    build: ./payments
    container_name: payments-worker
    restart: unless-stopped
    environment:
      BROKER_URI: amqp://admin:securepassword123@rabbitmq:5672/
      EXCHANGE_NAME: e_commerce
      LOG_LEVEL: debug
      SERVICE_NAME: payments
      KEYS_DIR: /keys
      QUEUE_NAME: fila.pagamento
    volumes:
      - keys:/keys:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully

  promotions:
    build: ./promotions
    container_name: promotions-worker
    restart: unless-stopped
    environment:
      BROKER_URI: amqp://admin:securepassword123@rabbitmq:5672/
      EXCHANGE_NAME: promotions
      LOG_LEVEL: debug
      SERVICE_NAME: promotions
      KEYS_DIR: /keys
    volumes:
      - keys:/keys:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully

  shipping:
    build: ./shipping
    container_name: shipping-worker
    restart: unless-stopped
    environment:
      BROKER_URI: amqp://admin:securepassword123@rabbitmq:5672/
      EXCHANGE_NAME: e_commerce
      LOG_LEVEL: debug
      SERVICE_NAME: shipping
      KEYS_DIR: /keys
      QUEUE_NAME: fila.entrega
    volumes:
      - keys:/keys:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully

volumes:
  rabbitmq_data:
  rabbitmq_logs:
  keys:
