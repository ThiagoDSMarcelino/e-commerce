server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker: re-resolve "main" se o container for recriado com outro IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Único backend acessível pela UI: o main (API gateway).
    location /api/ {
        set $main_upstream http://main:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $main_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Necessário para SSE (GET /orders/events): sem buffering e conexão longa.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: rotas do TanStack Router caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
